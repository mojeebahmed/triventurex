<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">
  <!-- Install as an app (academy-sw.js + academy.webmanifest; see js/academy/academy.js) -->
  <link rel="manifest" href="academy.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="images/academy/icon-192.png">
  <link rel="apple-touch-icon" href="images/academy/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Academy">
  <title>Triventurex Academy</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/academy.css">
  <link rel="stylesheet" href="css/help.css">
</head>
<body class="academy">

  <!-- Triventurex Academy: learn an edition's questions and places before playing.
       One edition at a time; works opened from disk and from the server (/academy). -->
  <header class="ac-top">
    <div class="ac-brand"><i data-icon="academyLogo"></i> <span class="ac-brand-name">Triventurex </span>Academy</div>
    <label class="ac-edition" title="Which edition to learn — the page reloads with it">
      <select id="ac-edition" class="settings-select"></select>
    </label>
    <span class="ac-spacer"></span>
    <!-- Text size (js/shared/text-size.js): only the question cards grow. Phones: in More -->
    <span class="text-size ac-desk" data-text-size role="group" aria-label="Text size on the cards">
      <button type="button" data-text-step="-1" title="Smaller text on the cards" aria-label="Smaller text"><i data-icon="textSmaller"></i></button>
      <span class="text-size-value" aria-live="polite">100%</span>
      <button type="button" data-text-step="1" title="Bigger text on the cards" aria-label="Bigger text"><i data-icon="textBigger"></i></button>
    </span>
    <a class="btn btn-secondary btn-small ac-play" href="index.html" title="Play the game" aria-label="Play the game"><i data-icon="playGame"></i><span class="ac-play-label"> Play the game</span></a>
    <button type="button" class="help-btn" onclick="openHelp(academyHelpTopic())" title="Help (?)" aria-label="Help"><i data-icon="help"></i></button>
  </header>

  <nav id="ac-modes" class="ac-modes" role="tablist"></nav>

  <div class="ac-body">
    <!-- One filter for every question mode (Places ignores it) -->
    <aside id="ac-side" class="ac-side">
      <details id="ac-filter" class="ac-filter" open>
        <summary><i data-icon="search"></i> Choose what to learn <span id="ac-filter-summary" class="ac-filter-summary"></span></summary>
        <!-- On a phone this opens as a sheet from the bottom (head + Show button only there) -->
        <div class="ac-filter-body">
          <div class="ac-bsheet-head ac-phone-only">
            <strong>Choose what to learn</strong>
            <button type="button" class="ac-bsheet-close" data-close-sheet aria-label="Close"><i data-icon="close"></i></button>
          </div>
          <input id="ac-search" type="search" placeholder="Search questions, answers or #id…" autocomplete="off">
          <select id="ac-diff" class="settings-select">
            <option value="all">Easy + hard</option><option value="easy" data-icon-text="easy">Easy</option><option value="hard" data-icon-text="hard">Hard</option>
          </select>
          <nav id="ac-tree" class="ac-tree"></nav>
          <div class="ac-bsheet-foot ac-phone-only">
            <button type="button" id="ac-filter-done" class="btn btn-primary" data-close-sheet>Show questions</button>
          </div>
        </div>
      </details>
    </aside>
    <main id="ac-main" class="ac-main"></main>
  </div>

  <!-- Phones: the modes that work best on a computer (filled by academy.js) -->
  <div id="ac-more" class="ac-bsheet ac-more hidden" role="dialog" aria-label="More"></div>
  <div id="ac-backdrop" class="ac-backdrop hidden" data-close-sheet></div>

  <textarea id="ac-export" class="rules-export hidden" rows="8" readonly></textarea>

  <script src="game_editions/editions.js"></script>
  <script src="js/shared/utils.js"></script>
  <script src="js/shared/icon-registry.js"></script>
  <script src="js/shared/icons-data.js"></script>
  <script src="js/shared/icons.js"></script>
  <script src="js/shared/help.js"></script>
  <script src="js/shared/config.js"></script>
  <script src="js/shared/text-size.js"></script>
  <script src="js/shared/edition.js"></script>
  <script src="js/shared/questions.js"></script>
  <script src="js/shared/marks.js"></script>
  <script src="js/shared/academy.js"></script>
  <script src="js/academy/academy.js"></script>
  <script src="js/academy/modes.js"></script>
</body>
</html>
