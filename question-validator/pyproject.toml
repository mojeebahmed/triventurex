[project]
name = "question-validator"
version = "0.1.0"
description = "Evidence-based validation of Triventurex quiz questions (CSV)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
qv = "qv.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qv*"]

[tool.setuptools.package-data]
qv = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py", "db/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
