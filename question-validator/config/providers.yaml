# Free-tier providers and their limits (decision 2026-11-15: free services only, $0 budget).
# Limits are what we allow ourselves; set them at or below the provider's free tier.
# Check Gemini limits on the AI Studio rate-limit page — they differ per project and change over time.
# Last checked 2026-11-16 (Mojeeb). Model ids = the API's names (GET v1beta/models), not the page's display names.

reserve_fraction: 0.05      # keep 5 % of every daily/monthly quota unused as a safety margin

llm:
  gemini:
    daily_reset_timezone: America/Los_Angeles   # Gemini daily quotas reset at midnight Pacific time
    models:
      gemini-3.5-flash-lite: {rpm: 15, rpd: 500}
      gemini-3.1-flash-lite: {rpm: 15, rpd: 500}
      gemini-3.8-flash:      {rpm: 5,  rpd: 20}
      gemini-3.7-flash:      {rpm: 5,  rpd: 20}
      gemini-3.6-flash:      {rpm: 5,  rpd: 20}
      # Also free on this key (AI Studio rate-limit page, 2026-11-16) — extra capacity, quality not measured yet:
      gemini-4-hydrogen:     {rpm: 5,  rpd: 20}
      gemini-3-flash-preview: {rpm: 5, rpd: 20}
      gemini-2.5-flash:      {rpm: 5,  rpd: 20}
      gemini-2.5-flash-lite: {rpm: 10, rpd: 20}
      # No free quota (0/0/0): gemini-2.5-pro, gemini-3.1-pro-preview, gemini-4-argon, gemini-4-carbon
  ollama:                    # local models on this Mac: $0, no daily limit, only speed
    base_url: http://localhost:11434
    timeout_s: 900
    models:                  # num_ctx must hold the whole prompt — S3 windows are up to ~12k tokens
      qwen3:14b:    {num_ctx: 24576, think: false}
      qwen3:8b:     {num_ctx: 24576, think: false}
      gemma3:12b:   {num_ctx: 24576}
      mistral-nemo: {num_ctx: 24576}
  pools:                     # provider/model, tried in order. The next entry takes over when one's daily
                             # quota is used up or (local) Ollama is not running / the model is not pulled.
    cheap: [gemini/gemini-3.5-flash-lite, gemini/gemini-3.1-flash-lite, gemini/gemini-2.5-flash-lite]
    judge: [gemini/gemini-3.6-flash, gemini/gemini-3.7-flash, gemini/gemini-3.8-flash, gemini/gemini-4-hydrogen,
           gemini/gemini-3-flash-preview, gemini/gemini-2.5-flash]   # 3.6 first: on 2026-11-15/16 it answered 13 of 15, 3.8 2 of 33, 3.7 0 of 8 (overloaded / timeouts)
    # Local models are $0 but slow (S3: 1–4 min per document on an M2 Pro vs ~1.5 s on Gemini; pilot trial
    # 2026-11-15: gemma3:12b grounded 13/15 quotes, qwen3:8b 19/24, qwen3:14b 4/7). Best as overflow after
    # the free Gemini quota: a run then keeps going slowly instead of stopping.
    cheap_then_local: [gemini/gemini-3.5-flash-lite, gemini/gemini-3.1-flash-lite, gemini/gemini-2.5-flash-lite, ollama/gemma3:12b]
    local_first: [ollama/gemma3:12b, gemini/gemini-3.5-flash-lite, gemini/gemini-3.1-flash-lite]

stage_pools:                 # which pool each model stage uses
  s1a: cheap
  s1b: cheap
  s3: cheap                  # cheap_then_local = keep going on gemma3:12b when Flash-Lite's free quota is used up
  s4: judge                  # blind answer — the strongest signal, so the stronger (Flash) pool
  s5: judge                  # verification
  s6: cheap                  # quality (no evidence)

search:
  order: [parallel, tavily, exa]   # tried in this order until one has results; each stops at its free limit
  parallel:                  # free hosted MCP, anonymous; no published limits → our own soft cap
    daily_soft_cap: 300
    rpm: 20
  tavily:
    credits_per_month: 1000
    credits_per_search: 1    # "basic" depth
    rpm: 60
  exa:
    usd_credit_per_month: 10.0
    est_usd_per_search: 0.005   # replaced by the cost Exa reports for each call
    rpm: 30
  wikipedia:                 # free, no key; Wikimedia asks for modest request rates
    rpm: 60
  alislam:                   # free; the edition's official source — be polite
    rpm: 10
  sitemaps:                  # free sites searched by the words in their article URLs (read from the sitemap,
                             # cached in data/cache/sitemaps/). Used for editions whose frame lists the domain.
    alhakam:                 # Al Hakam (Ahmadiyya weekly) — e.g. the "Prophets of Allah" series; robots.txt allows
      domain: alhakam.org
      sitemap: https://www.alhakam.org/sitemap.xml
      include: post-sitemap
      refresh_days: 7
      rpm: 10

fetch:
  rpm_per_domain: 10
  timeout_s: 20
  max_bytes: 3000000
