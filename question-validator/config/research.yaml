# Research depth (phase 2). Lower numbers spend fewer free credits.
max_web_queries_per_question: 4      # Tavily/Exa searches per question (blind first, then challenge/note)
results_per_query: 5
max_documents_per_question: 5        # web + Wikipedia documents read by S3 (mode A)
max_note_documents_per_question: 2   # documents read for note claims (mode B)
wikipedia_results: 1                 # free extra source per question
alislam_search_results: 2            # free; only for profiles whose frame lists alislam.org
library_pages_per_question: 2        # book pages from the local library (config/library.yaml), on top of the web documents
site_search_results: 2               # free; per sitemap site (providers.yaml search.sitemaps) the frame lists
search_cache_days: 60
s3_window_chars: 40000               # long documents are read in windows of this size …
s3_window_overlap_chars: 1000
s3_max_windows: 2                    # … at most this many per document
s3_retry_dropped_quotes: true        # one more S3 request for a window when a quote is not word for word (only then)
audit_sample_percent: 5              # share of auto_ok questions routed to review anyway (METHODOLOGY §9.3)
batch_size: 25                       # most questions per `qv next` batch (also limited by today's free quota)
# Stored pages first (knowledge base phase 3): pages already collected (data/kb/index.sqlite) are searched with the
# question's blind queries before the web, and the best ones are read again, blind — documents only, never another
# question's quotes or answers.
stored_pages_per_question: 2         # stored pages read per question, on top of the web documents (0 = off)
stored_results_per_query: 10         # index results looked at per blind query (fused with RRF)
stored_max_age_days: 365             # time-sensitive questions (records, current figures) skip older stored pages
stored_first_skip_web: false         # true = skip the web searches when enough stored pages qualify (keep off for now)
stored_skip_web_min: 2               # … how many stored pages are "enough"
pdf_pages_per_document: 1            # a web PDF is stored page by page; this many best-matching pages are read

# Prepare page: wording flags worked out in code (free) before checking — hints for a person, never a verdict.
prepare_long_question_words: 25      # a question with more words is flagged "long question"
prepare_long_answer_words: 8         # an open answer with more words is flagged "long answer"
